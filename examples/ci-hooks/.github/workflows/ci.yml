# =============================================================================
# BEFORE: Traditional GitHub Actions workflow
#
# This file is what the hooks example REPLACES. It's kept here for comparison.
# With justfile hooks, the entire workflow below reduces to:
#
#   - uses: actions/checkout@v4
#   - run: just build
#   - run: just test
#   - run: just deploy production
#
# All the status reporting, artifact uploading, and Slack notifications move
# into .ci/hooks.just — where they are testable locally and reusable across
# CI systems.
# =============================================================================

name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- CI plumbing: set pending status ---
      - name: Set build status pending
        uses: myorg/github-status-action@v1
        with:
          state: pending
          context: build
          description: "Build is running..."

      # --- Actual build ---
      - name: Build
        run: cargo build --release

      # --- CI plumbing: set success status ---
      - name: Set build status success
        if: success()
        uses: myorg/github-status-action@v1
        with:
          state: success
          context: build
          description: "Build passed"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- CI plumbing: set pending status ---
      - name: Set test status pending
        uses: myorg/github-status-action@v1
        with:
          state: pending
          context: test

      # --- Actual test ---
      - name: Test
        run: cargo test --release -- --test-threads=4

      # --- CI plumbing: set success status ---
      - name: Set test status success
        if: success()
        uses: myorg/github-status-action@v1
        with:
          state: success
          context: test

      # --- CI plumbing: upload artifacts ---
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/test-results/

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/llvm-cov/lcov.info

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lint status pending
        uses: myorg/github-status-action@v1
        with:
          state: pending
          context: lint

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

      - name: Set lint status success
        if: success()
        uses: myorg/github-status-action@v1
        with:
          state: success
          context: lint

  deploy:
    needs: [build, test, lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # --- CI plumbing: check secrets ---
      - name: Verify secrets
        run: |
          for var in DEPLOY_TOKEN DEPLOY_HOST SLACK_WEBHOOK_URL; do
            if [ -z "${!var}" ]; then
              echo "::error::Required secret $var is not set"
              exit 1
            fi
          done
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Set deploy status pending
        uses: myorg/github-status-action@v1
        with:
          state: pending
          context: deploy

      # --- Actual deploy ---
      - name: Deploy
        run: ./scripts/deploy.sh production
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      # --- CI plumbing: notify ---
      - name: Set deploy status success
        if: success()
        uses: myorg/github-status-action@v1
        with:
          state: success
          context: deploy

      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {"text": ":rocket: Deployed ${{ github.sha }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
