# =============================================================================
# AFTER: The replacement GitHub Actions workflow using just + hooks
#
# All CI plumbing (status reporting, artifacts, notifications) is handled by
# the hooks in .ci/hooks.just. This workflow just calls `just <recipe>`.
# =============================================================================

name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "true"
  CI_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: artifacts/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just lint

  deploy:
    needs: [build, test, lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just --yes deploy production
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
